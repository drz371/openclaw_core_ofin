[package]
name = "clawfed"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[features]
default = ["tls"]
tls = ["dep:rustls"]
sm-crypto = ["dep:sm-crypto"]
auth = ["dep:x509-parser"]
fl = []

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.11"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4.4", features = ["derive"] }
rustls = { version = "0.21", optional = true }
sm-crypto = { version = "0.1", optional = true }
x509-parser = { version = "0.16", optional = true }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]
tonic-build = "0.11"

[[bin]]
name = "clawfed"
path = "src/main.rs"
